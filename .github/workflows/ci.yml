name: ci

# 只跑「不需要外部依赖」的检查：lint + 单测 + 语法编译。
# 需要 Milvus / LLM / API Key 的链路（检索、作答）不在 CI 里跑，
# 它们由 docs/eval/report.md 那次消融评测覆盖，避免 CI 变慢或因为没 key 而假红。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff + pytest
        run: python -m pip install --upgrade pip ruff pytest

      # 只开 F（pyflakes：未使用导入/变量、重复定义）与 E9（语法错误）。
      # 不开 E/W 全套：那是风格偏好，会把 diff 变成吵架。
      - name: Lint（未使用导入 / 未使用变量 / 语法错误）
        run: python -m ruff check --select F,E9 .

      - name: Unit tests
        run: python -m pytest

      - name: Compile check
        run: python -m compileall -q backend scripts
