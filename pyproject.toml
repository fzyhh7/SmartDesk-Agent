[project]
name = "SmartDesk-Agent"
version = "0.1.0"
description = "SmartDesk-Agent —— 基于 LangGraph 与 MCP 的企业内部服务台受控执行 Agent"
requires-python = ">=3.12"
dependencies = [
    # 编排与模型
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langgraph>=1.0",
    "langchain-openai>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langgraph-checkpoint-postgres>=3.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    # 工具层：fastmcp 4.x 依赖 mcp>=2，而 langchain-mcp-adapters 0.3.x 要求 mcp<2，
    # 所以这两条必须锁在 3.x / 1.x，否则 get_tools() 会 ImportError: RequestContext
    "fastmcp>=3.2,<4",
    "mcp>=1.24,<2",
    "langchain-mcp-adapters>=0.3,<0.4",
    # 检索与精排
    "pymilvus>=2.6",
    "httpx>=0.27",
    # HTTP 层（/chat/stream 走 StreamingResponse，SSE 不需要额外依赖）
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # 知识库生产链：制度 md → PDF → MinerU 解析 → 切分
    "reportlab>=4.0",
    "pypdf>=5.0",
    "mineru-open-sdk>=0.2",
    "langchain-text-splitters>=1.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true


