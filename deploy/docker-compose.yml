# SmartDesk-Agent 本地依赖服务
# 启动：cd deploy; docker compose up -d
# 验收：docker compose ps（等 milvus 的 HEALTH 变 healthy，约 1-3 分钟）
#
# 说明：MinIO 在 2025 年把社区版镜像从 Docker Hub / Quay 全部下架，
# 官方 compose 里的 minio/minio:<RELEASE...> 已经拉不到。
# 因此这里改用 Milvus standalone 的「本地存储」后端（COMMON_STORAGETYPE=local），
# 少一个容器、少一份内存，功能（dense+sparse 混合检索）完全不受影响。
# 如需切回 MinIO，见文件末尾注释里的 fallback。
name: smartdesk

services:
  postgres:
    image: ${PG_IMAGE}
    container_name: smartdesk-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      # 关键：bind mount 目录里可能有 .gitkeep 等隐藏文件，initdb 要求数据目录为空，
      # 所以把 PGDATA 指到挂载点下的子目录（官方推荐做法）
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Shanghai
    ports:
      - "${PG_PORT}:5432"
    volumes:
      - ./data/pg:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  etcd:
    image: ${ETCD_IMAGE}
    container_name: smartdesk-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - ./data/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: ${MILVUS_IMAGE}
    container_name: smartdesk-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      # 关键：不依赖对象存储，向量/索引数据直接写本地卷
      COMMON_STORAGETYPE: local
      LOCALSTORAGE_PATH: /var/lib/milvus/data
      TZ: Asia/Shanghai
    ports:
      - "${MILVUS_PORT}:19530"
      - "${MILVUS_HTTP_PORT}:9091"
    volumes:
      - ./data/milvus:/var/lib/milvus
    depends_on:
      - etcd
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 180s
      timeout: 20s
      retries: 5

  attu:
    image: ${ATTU_IMAGE}
    container_name: smartdesk-attu
    restart: unless-stopped
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "${ATTU_PORT}:3000"
    depends_on:
      - milvus

# ============================================================
# Fallback：如果哪天想切回 MinIO（或本地存储在你的 Milvus 版本上不可用），
# 1) 取消下面注释；2) milvus 的 environment 换回：
#      ETCD_ENDPOINTS: etcd:2379
#      MINIO_ADDRESS: minio:9000
#      MINIO_ACCESS_KEY_ID: ${MINIO_USER}
#      MINIO_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
#    并删掉 COMMON_STORAGETYPE / LOCALSTORAGE_PATH；3) depends_on 加回 minio。
# 注意 Bitnami 镜像的数据目录是 /bitnami/minio/data，环境变量是 ROOT_USER/ROOT_PASSWORD。
#
#  minio:
#    image: ${MINIO_IMAGE}
#    container_name: smartdesk-minio
#    restart: unless-stopped
#    environment:
#      MINIO_ROOT_USER: ${MINIO_USER}
#      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
#    command: minio server /bitnami/minio/data --console-address ":9001"
#    ports:
#      - "${MINIO_PORT}:9000"
#      - "${MINIO_CONSOLE_PORT}:9001"
#    volumes:
#      - ./data/minio:/bitnami/minio/data
# ============================================================

